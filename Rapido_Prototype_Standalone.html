<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapido Trip Chaining — Working Prototype</title>
<style>
  * { box-sizing: border-box; }
  html { background:#f5f4ef; color:#1f1e1d; font:14px/1.4 -apple-system, "Segoe UI", Arial, sans-serif; }
  body { margin:0; padding:56px 16px; display:flex; flex-direction:column; align-items:center; overflow-x:hidden; }
  @media (max-width: 480px) { body { padding:28px 10px; } }
  .deviceScale { position:relative; }

  .toggle { display:flex; background:#eceae4; border-radius:999px; padding:4px; margin-bottom:22px; gap:2px; }
  .toggleBtn { border:none; background:transparent; padding:10px 20px; border-radius:999px; font-size:13px; font-weight:700; color:#6b6a68; cursor:pointer; transition:background .2s ease, color .2s ease; }
  .toggleBtn.on { background:#141413; color:#fff; }

  .device { position:relative; width:420px; height:862px; background:#0c0c0c; border-radius:52px; padding:16px; box-shadow:0 14px 44px rgba(0,0,0,.2); transform-origin: top left; }
  .notch { position:absolute; top:16px; left:50%; transform:translateX(-50%); width:142px; height:25px; background:#0c0c0c; border-radius:0 0 17px 17px; z-index:6; }
  .sidebtn { position:absolute; width:3px; background:#1c1c1c; border-radius:2px; }
  .sidebtn.power { right:-3px; top:170px; height:66px; }
  .sidebtn.vol1 { left:-3px; top:145px; height:34px; }
  .sidebtn.vol2 { left:-3px; top:190px; height:56px; }

  .phone { width:388px; height:830px; background:#fff; border-radius:38px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .header { flex-shrink:0; padding:38px 20px 8px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #f4f4f4; }
  .headerLabel { font-size:15px; font-weight:800; color:#141413; }
  .dots { flex-shrink:0; display:flex; gap:5px; justify-content:center; padding:8px 0 2px; }
  .dot { width:6px; height:6px; border-radius:50%; background:#e2e2e2; transition:background .2s ease; }
  .dot.on { background:#FFC629; }
  .content { flex:1; position:relative; overflow:hidden; }
  .screen { position:absolute; inset:0; padding:14px 20px 0; overflow-y:auto; overflow-x:hidden; box-sizing:border-box; opacity:0; transform:translateY(10px); transition:opacity .38s ease, transform .38s ease; pointer-events:none; }
  .screen.active { opacity:1; transform:translateY(0); pointer-events:auto; z-index:2; }
  .footer { flex-shrink:0; padding:12px 20px 22px; }
  .btn-primary { border:none; background:#FFC629; color:#141413; border-radius:9px; padding:15px; font-size:14.5px; font-weight:800; width:100%; text-align:center; cursor:pointer; display:block; }
  .btn-secondary { border:none; background:#f2f2f2; color:#141413; border-radius:9px; padding:15px; font-size:14px; font-weight:700; width:100%; text-align:center; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .chip { border:1px solid #ddd; border-radius:8px; padding:9px 15px; font-size:13px; font-weight:700; color:#5c5c5c; cursor:pointer; }
  .chip.on { border:1.5px solid #141413; background:#141413; color:#fff; }
  .restart { border:none; background:none; font-size:13px; font-weight:700; color:#8a8a8a; cursor:pointer; display:block; margin:0 auto; }

  .tap { position:absolute; width:10px; height:10px; margin-left:-5px; margin-top:-5px; border-radius:50%; background:#FFC629; pointer-events:none; z-index:80; animation: tapdot .7s cubic-bezier(.2,.8,.2,1) forwards; mix-blend-mode:multiply; will-change:transform,opacity; }
  .tapring { position:absolute; width:10px; height:10px; margin-left:-5px; margin-top:-5px; border-radius:50%; border:2px solid #b8860b; pointer-events:none; z-index:81; animation: tapring .7s cubic-bezier(.2,.8,.2,1) forwards; will-change:transform,opacity; }
  @keyframes tapdot {
    0%   { transform:scale(0);    opacity:0; }
    30%  { transform:scale(1.9);  opacity:.32; }
    68%  { transform:scale(1.9);  opacity:.3; }
    100% { transform:scale(2.3);  opacity:0; }
  }
  @keyframes tapring {
    0%   { transform:scale(0);    opacity:0; }
    30%  { transform:scale(2.1);  opacity:.8; }
    68%  { transform:scale(2.1);  opacity:.55; }
    100% { transform:scale(5);    opacity:0; }
  }

  .controls { display:flex; background:#eceae4; border-radius:999px; padding:4px; margin-top:20px; gap:2px; }
  .ctrlBtn { border:none; background:transparent; width:42px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .2s ease; }
  .ctrlBtn:hover { background:rgba(0,0,0,.06); }
  .ctrlBtn.active { background:#141413; }
  .ctrlBtn svg path, .ctrlBtn svg rect { fill:#6b6a68; transition:fill .2s ease; }
  .ctrlBtn.active svg path, .ctrlBtn.active svg rect { fill:#FFC629; }
</style>

      <div style="flex:1;"><div style="font-size:12.5px;font-weight:700;color:#141413;">Auto</div><div style="font-size:11px;color:#8a8a8a;">Yesterday · 6:40 PM</div></div>
      <div style="text-align:right;"><div style="font-size:12.5px;font-weight:800;color:#141413;">₹92</div><div style="font-size:10px;color:#a3a3a3;">Completed</div></div>
    </div>
  </div>
  `;
}

document.getElementById('content').innerHTML = screensHTML();

var labels = ["Review & Pay","Payment","Payment","Your Trip","Your Trip","Pickup Confirmed","My Rides"];
var footerMap = {
  0: { label: "Continue to Payment", next: 1 },
  1: { label: "Pay \u20B9450", next: 2 },
  2: { label: "Continue", next: 3 },
  3: { label: "Continue", next: 4 },
  5: { label: "View My Rides", next: 6 }
};

var contentEl = document.getElementById('content');
var deviceEl = document.getElementById('device');
var deviceScaleEl = document.getElementById('deviceScale');
var mode = 'watch'; // 'watch' | 'try'
var state = { step: 0, forOther: false, locationSet: false };

var DESIGN_W = 420, DESIGN_H = 862;
var currentScale = 1;
function fitDevice() {
  var margin = 20; // breathing room on each side
  var maxW = window.innerWidth - margin * 2;
  var scale = Math.min(1, maxW / DESIGN_W);
  currentScale = scale;
  deviceEl.style.transform = 'scale(' + scale + ')';
  deviceScaleEl.style.width = (DESIGN_W * scale) + 'px';
  deviceScaleEl.style.height = (DESIGN_H * scale) + 'px';
}
window.addEventListener('resize', fitDevice);
fitDevice();

function tapAt(targetEl, xRatio) {
  if (!targetEl) return;
  xRatio = (typeof xRatio === 'number') ? xRatio : 0.5;
  var dRect = deviceEl.getBoundingClientRect();
  var tRect = targetEl.getBoundingClientRect();
  // getBoundingClientRect values are post-scale screen pixels, but tap/tapring
  // are children of the already-scaled #device, so convert back to local
  // (pre-scale) units — otherwise the transform scales them a second time.
  var x = (tRect.left + tRect.width * xRatio - dRect.left) / currentScale;
  var y = (tRect.top + tRect.height/2 - dRect.top) / currentScale;
  var ring = document.createElement('div');
  ring.className = 'tapring';
  ring.style.left = x + 'px'; ring.style.top = y + 'px';
  var dot = document.createElement('div');
  dot.className = 'tap';
  dot.style.left = x + 'px'; dot.style.top = y + 'px';
  deviceEl.appendChild(ring);
  deviceEl.appendChild(dot);
  setTimeout(function() { ring.remove(); dot.remove(); }, 800);
}

function render() {
  contentEl.querySelectorAll('.screen').forEach(function(s) {
    s.classList.toggle('active', parseInt(s.getAttribute('data-s')) === state.step);
  });
  document.getElementById('headerLabel').textContent = labels[state.step];

  var dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = "";
  for (var i = 0; i < 7; i++) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === state.step ? ' on' : '');
    dotsEl.appendChild(d);
  }

  contentEl.querySelectorAll('.who-self').forEach(function(el){ el.className = 'chip who-self' + (state.forOther ? '' : ' on'); });
  contentEl.querySelectorAll('.who-other').forEach(function(el){ el.className = 'chip who-other' + (state.forOther ? ' on' : ''); });
  contentEl.querySelectorAll('.passengerBox').forEach(function(el){ el.style.display = state.forOther ? 'block' : 'none'; });
  contentEl.querySelectorAll('.chained-self').forEach(function(el){ el.style.display = state.forOther ? 'none' : 'block'; });
  contentEl.querySelectorAll('.chained-other').forEach(function(el){ el.style.display = state.forOther ? 'block' : 'none'; });
  contentEl.querySelectorAll('.locBtn').forEach(function(el){ el.style.display = state.locationSet ? 'none' : 'flex'; });
  contentEl.querySelectorAll('.locSet').forEach(function(el){ el.style.display = state.locationSet ? 'block' : 'none'; });
  contentEl.querySelectorAll('.confirmNoteSelf').forEach(function(el){ el.style.display = state.forOther ? 'none' : 'block'; });
  contentEl.querySelectorAll('.confirmNoteOther').forEach(function(el){ el.style.display = state.forOther ? 'block' : 'none'; });
  contentEl.querySelectorAll('.ridesForOther').forEach(function(el){ el.style.display = state.forOther ? 'block' : 'none'; });

  var footer = document.getElementById('footer');
  if (state.step === 4) {
    footer.style.visibility = 'hidden';
  } else if (state.step === 6) {
    footer.style.visibility = 'visible';
    footer.innerHTML = '<button class="restart" id="restartBtn">↻ Restart</button>';
  } else if (footerMap[state.step]) {
    footer.style.visibility = 'visible';
    footer.innerHTML = '<button class="btn-primary" id="footerBtn">' + footerMap[state.step].label + '</button>';
  } else {
    footer.style.visibility = 'hidden';
  }
}

// ---------------- AUTOPLAY (watch mode) ----------------
var seq = [0,1,2,3,4,5,6];
var seqIndex = 0;
var playTimer = null, tapTimer = null;
var isPlaying = false;

function holdTimeFor(s) { if (s === 2) return 1500; if (s === 6) return 2400; return 2100; }

function playStep() {
  state.step = seq[seqIndex];
  state.forOther = false;
  state.locationSet = false;
  render();
  var holdTime = holdTimeFor(state.step);

  tapTimer = setTimeout(function() {
    var btn = (state.step === 4) ? contentEl.querySelector('.confirmPickupBtn') : document.getElementById('footerBtn');
    var isFooterBtn = state.step !== 4;
    tapAt(btn, isFooterBtn ? 0.84 : 0.5);
  }, holdTime - 900);

  playTimer = setTimeout(function() {
    seqIndex = (seqIndex + 1) % seq.length;
    playStep();
  }, holdTime);
}

function setCtrlActive(which) {
  ['playBtn','pauseBtn','stopBtn'].forEach(function(id){ document.getElementById(id).classList.remove('active'); });
  if (which) document.getElementById(which).classList.add('active');
}
function startPlay() {
  if (mode !== 'watch' || isPlaying) return;
  isPlaying = true; setCtrlActive('playBtn'); playStep();
}
function pausePlay() {
  isPlaying = false; clearTimeout(playTimer); clearTimeout(tapTimer); setCtrlActive('pauseBtn');
}
function stopPlay() {
  isPlaying = false; clearTimeout(playTimer); clearTimeout(tapTimer);
  seqIndex = 0; state = { step: 0, forOther: false, locationSet: false }; render(); setCtrlActive('stopBtn');
}

// ---------------- TRY IT YOURSELF (manual mode) ----------------
contentEl.addEventListener('click', function(e) {
  if (mode !== 'try') return;
  var t = e.target.closest('.who-self, .who-other, .locBtn, .confirmPickupBtn, .confirmPickupBtn2');
  if (!t) return;
  if (t.classList.contains('who-self')) state.forOther = false;
  else if (t.classList.contains('who-other')) state.forOther = true;
  else if (t.classList.contains('locBtn')) state.locationSet = true;
  else if (t.classList.contains('confirmPickupBtn') || t.classList.contains('confirmPickupBtn2')) state.step = 5;
  render();
});
document.getElementById('footer').addEventListener('click', function(e) {
  if (mode !== 'try') return;
  if (e.target.id === 'footerBtn') {
    if (footerMap[state.step]) { state.step = footerMap[state.step].next; render(); }
  } else if (e.target.id === 'restartBtn') {
    state = { step: 0, forOther: false, locationSet: false }; render();
  }
});

// ---------------- MODE TOGGLE ----------------
function setMode(m) {
  if (m === mode) return;
  mode = m;
  clearTimeout(playTimer); clearTimeout(tapTimer); isPlaying = false;
  document.getElementById('toggleWatch').classList.toggle('on', m === 'watch');
  document.getElementById('toggleTry').classList.toggle('on', m === 'try');
  document.getElementById('controls').style.display = (m === 'watch') ? 'flex' : 'none';

  seqIndex = 0;
  state = { step: 0, forOther: false, locationSet: false };
  render();
  if (m === 'watch') startPlay();
}

render();
startPlay();
</script>

</body>
</html>
